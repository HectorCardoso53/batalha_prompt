<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Admin — Batalha de Prompt</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="header">
    <a href="../index.html" class="header-brand">
      <img src="../prefeitura_oriximina.png" alt="Prefeitura de Oriximiná" class="header-logo" />
      <span class="header-title">Batalha de Prompt</span>
    </a>
    <nav>
      <div class="dropdown" id="dd">
        <button class="btn-admin" id="ddBtn">Admin <span class="arrow">▾</span></button>
        <div class="dropdown-menu" id="ddMenu">
          <a href="index.html">Painel Admin</a>
          <a href="novo-desafio.html">+ Novo Desafio</a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <div class="page">
      <div class="page-inner">
        <div class="flex-between" style="margin-bottom:32px;">
          <div>
            <h1 class="secao-titulo" style="text-align:left;">Painel Admin</h1>
            <div class="secao-traco" style="margin:8px 0 0;"></div>
          </div>
          <a href="novo-desafio.html" class="btn btn-primary" style="white-space:nowrap;">+ Novo Desafio</a>
        </div>

        <!-- Chave OpenAI -->
        <div class="card" style="margin-bottom:24px;">
          <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
            <div style="flex:1;min-width:200px;">
              <p style="font-weight:700;color:var(--azul-marinho);margin-bottom:2px;">Chave OpenAI</p>
              <p id="key-status" style="font-size:13px;color:var(--texto-sec);"></p>
            </div>
            <button id="btn-key" class="btn btn-secondary btn-sm">Configurar chave</button>
          </div>
        </div>

        <div id="sem-desafio" class="card" style="display:none;text-align:center;padding:48px 24px;">
          <p style="font-size:18px;color:var(--texto-sec);margin-bottom:16px;">Nenhum desafio ativo.</p>
          <a href="novo-desafio.html" class="btn btn-primary">Criar novo desafio</a>
        </div>
        <div id="card-desafio" class="card" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
          <div style="flex:1;min-width:200px;">
            <h2 id="ch-title" style="font-weight:700;color:var(--azul-marinho);font-size:18px;margin-bottom:4px;"></h2>
            <p id="ch-subs" style="font-size:13px;color:var(--texto-sec);"></p>
            <p id="ch-status" style="font-size:12px;font-weight:700;margin-top:4px;"></p>
          </div>
          <div class="flex-row" style="flex-wrap:wrap;">
            <a href="desafio.html" class="btn btn-secondary btn-sm">Gerenciar</a>
            <a href="../leaderboard.html" class="btn btn-secondary btn-sm">Ranking</a>
            <button id="btn-toggle" class="btn btn-secondary btn-sm"></button>
            <button id="btn-limpar" class="btn btn-secondary btn-sm">Limpar submissões</button>
            <button id="btn-apagar" class="btn btn-secondary btn-sm">Apagar desafio</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-esq">
      <p>Prefeitura Municipal de Oriximiná</p>
      <p>A transformação não vai parar</p>
    </div>
    <div class="footer-dir">
      <p>SEMEG</p>
      <p>Secretaria Municipal de Eficiência Governamental</p>
    </div>
  </footer>

  <script src="../js/header.js"></script>
  <script type="module">
    import { DESAFIO } from "../js/app.js";

    const subs = JSON.parse(localStorage.getItem("submissions") || "[]");

    if (!DESAFIO.isActive && !DESAFIO.title) {
      document.getElementById("card-desafio").style.display = "none";
      document.getElementById("sem-desafio").style.display  = "block";
    }

    document.getElementById("ch-title").textContent = DESAFIO.title;
    document.getElementById("ch-subs").textContent  = subs.length + " submissão(ões)";

    function atualizarStatus() {
      const cfg = (() => { try { return JSON.parse(localStorage.getItem("desafioConfig") || "null"); } catch { return null; } })();
      const ativo = cfg ? cfg.isActive : DESAFIO.isActive;
      document.getElementById("ch-status").textContent = ativo ? "● Ativo" : "○ Pausado";
      document.getElementById("ch-status").style.color = ativo ? "#065F46" : "#92400E";
      document.getElementById("btn-toggle").textContent = ativo ? "Pausar" : "Ativar";
      return ativo;
    }

    let ativo = atualizarStatus();

    document.getElementById("btn-toggle").addEventListener("click", () => {
      const cfg = (() => { try { return JSON.parse(localStorage.getItem("desafioConfig") || "null") || {...DESAFIO}; } catch { return {...DESAFIO}; } })();
      cfg.isActive = !ativo;
      localStorage.setItem("desafioConfig", JSON.stringify(cfg));
      ativo = !ativo;
      atualizarStatus();
    });

    document.getElementById("btn-limpar").addEventListener("click", () => {
      if (!confirm("Apagar todas as " + subs.length + " submissões? Esta ação não pode ser desfeita.")) return;
      localStorage.removeItem("submissions");
      document.getElementById("ch-subs").textContent = "0 submissão(ões)";
      alert("Submissões apagadas.");
    });

    // Chave OpenAI
    const keyAtual = localStorage.getItem("openaiKey");
    document.getElementById("key-status").textContent = keyAtual ? "✓ Chave configurada" : "⚠ Chave não configurada";
    document.getElementById("key-status").style.color = keyAtual ? "#065F46" : "#92400E";

    document.getElementById("btn-key").addEventListener("click", () => {
      const nova = prompt("Cole aqui sua chave da OpenAI (sk-...):", localStorage.getItem("openaiKey") || "");
      if (nova === null) return;
      if (nova.startsWith("sk-")) {
        localStorage.setItem("openaiKey", nova.trim());
        document.getElementById("key-status").textContent = "✓ Chave configurada";
        document.getElementById("key-status").style.color = "#065F46";
      } else {
        alert("Chave inválida. Deve começar com sk-");
      }
    });

    document.getElementById("btn-apagar").addEventListener("click", () => {
      if (!confirm("Apagar este desafio e todas as submissões? Esta ação não pode ser desfeita.")) return;
      localStorage.setItem("desafioConfig", JSON.stringify({ id:"", title:"", masterImage:"", masterPrompt:"", isActive:false }));
      localStorage.removeItem("submissions");
      location.reload();
    });
  </script>
</body>
</html>
