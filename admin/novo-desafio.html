<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novo Desafio — Batalha de Prompt</title>
  <link rel="icon" href="../logo (1).png" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
</head>
<body>
  <header class="header">
    <img src="../logo (1).png" alt="Batalha de Prompt" class="header-banner" />
    <nav>
      <div class="dropdown" id="dd">
        <button class="btn-admin" id="ddBtn">Admin <span class="arrow">▾</span></button>
        <div class="dropdown-menu" id="ddMenu">
          <a href="index.html">Painel Admin</a>
          <a href="novo-desafio.html">+ Novo Desafio</a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <div class="page">
      <div class="page-inner-md">
        <div style="margin-bottom:32px;">
          <a href="index.html" class="back-link">← Voltar ao Admin</a>
          <h1 class="secao-titulo" style="text-align:left;margin-top:12px;">Novo Desafio</h1>
          <div class="secao-traco" style="margin:8px 0 0;"></div>
        </div>
        <div class="card">
          <form id="form-novo" style="display:flex;flex-direction:column;gap:22px;">
            <div>
              <label class="label" for="inp-title">Título do Desafio</label>
              <input id="inp-title" type="text" class="input" required placeholder="Ex: Desafio #1 — Paisagem ao pôr do sol" />
            </div>

            <div>
              <label class="label">Imagem Master</label>
              <p style="font-size:13px;color:var(--texto-sec);margin-bottom:12px;">Faça upload da imagem que os jogadores vão tentar recriar.</p>
              <label id="upload-area" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:2px dashed #CBD5E0;border-radius:10px;padding:32px 16px;cursor:pointer;background:var(--fundo);transition:border-color 0.2s;">
                <i class="bi bi-image" style="font-size:36px;color:var(--texto-sec);"></i>
                <span id="upload-label" style="font-size:14px;color:var(--texto-sec);text-align:center;">Clique para escolher ou arraste a imagem aqui</span>
                <input id="inp-img" type="file" accept="image/*" required style="display:none;" />
              </label>
              <div id="preview-wrap" style="display:none;margin-top:14px;border-radius:8px;overflow:hidden;border:2px solid var(--ambar);">
                <img id="img-preview" src="" alt="Preview" style="width:100%;object-fit:contain;max-height:260px;display:block;" />
              </div>
            </div>

            <div>
              <label class="label" for="inp-mprompt">Prompt Original <span style="color:var(--texto-sec);font-weight:400;">(secreto)</span></label>
              <textarea id="inp-mprompt" class="input" rows="4" required
                placeholder="Cole aqui o prompt exato que você usou para gerar a imagem master..."
                style="resize:none;"></textarea>
            </div>

            <div>
              <label class="label" for="inp-time">Tempo limite (minutos)</label>
              <input id="inp-time" type="number" class="input" min="1" max="60" value="3" required style="max-width:120px;" />
            </div>

            <p id="erro" style="color:#DC2626;font-size:14px;background:#FEE2E2;padding:10px 14px;border-radius:8px;display:none;"></p>
            <button type="submit" id="btn-criar" class="btn btn-primary" style="width:100%;">Criar Desafio</button>
          </form>
        </div>
      </div>
    </div>
  </main>


  <script src="../js/header.js"></script>
  <script type="module">
    import { db } from "../js/app.js";
    import { ref, set, remove } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

    let masterImageData = null;

    function comprimirImagem(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.onload = () => {
            const MAX = 900;
            let w = img.width, h = img.height;
            if (w > MAX || h > MAX) {
              if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
              else       { w = Math.round(w * MAX / h); h = MAX; }
            }
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", 0.82));
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    const inputImg   = document.getElementById("inp-img");
    const uploadArea = document.getElementById("upload-area");

    inputImg.addEventListener("change", async () => {
      const file = inputImg.files[0];
      if (!file) return;
      document.getElementById("upload-label").textContent = "Comprimindo...";
      masterImageData = await comprimirImagem(file);
      document.getElementById("img-preview").src          = masterImageData;
      document.getElementById("preview-wrap").style.display = "block";
      document.getElementById("upload-label").textContent = file.name;
      uploadArea.style.borderColor = "var(--ambar)";
    });

    // Drag & drop
    uploadArea.addEventListener("dragover", e => { e.preventDefault(); uploadArea.style.borderColor = "var(--ambar)"; });
    uploadArea.addEventListener("dragleave", () => uploadArea.style.borderColor = "#CBD5E0");
    uploadArea.addEventListener("drop", e => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith("image/")) {
        inputImg.files = e.dataTransfer.files;
        inputImg.dispatchEvent(new Event("change"));
      }
    });

    document.getElementById("form-novo").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn          = document.getElementById("btn-criar");
      const erro         = document.getElementById("erro");
      const title        = document.getElementById("inp-title").value.trim();
      const masterPrompt = document.getElementById("inp-mprompt").value.trim();
      const timeLimit    = parseInt(document.getElementById("inp-time").value) * 60;

      if (!masterImageData) {
        erro.textContent = "Selecione uma imagem.";
        erro.style.display = "block"; return;
      }
      erro.style.display = "none";
      btn.disabled = true; btn.textContent = "Salvando...";

      try {
        await set(ref(db, "challenge"), {
          title, masterImage: masterImageData, masterPrompt,
          timeLimit, isActive: false, startedAt: null,
        });
        await remove(ref(db, "submissions"));
        location.href = "index.html";
      } catch (err) {
        erro.textContent = "Erro ao salvar: " + (err.message || err);
        erro.style.display = "block";
        btn.disabled = false; btn.textContent = "Criar Desafio";
      }
    });
  </script>
</body>
</html>
