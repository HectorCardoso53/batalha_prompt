<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novo Desafio — Batalha de Prompt</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
</head>
<body>
  <header class="header">
    <a href="../index.html" class="header-brand">
      <img src="../prefeitura_oriximina.png" alt="Prefeitura de Oriximiná" class="header-logo" />
      <span class="header-title">Batalha de Prompt</span>
    </a>
    <nav>
      <div class="dropdown" id="dd">
        <button class="btn-admin" id="ddBtn">Admin <span class="arrow">▾</span></button>
        <div class="dropdown-menu" id="ddMenu">
          <a href="index.html">Painel Admin</a>
          <a href="novo-desafio.html">+ Novo Desafio</a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <div class="page">
      <div class="page-inner-md">
        <div style="margin-bottom:32px;">
          <a href="index.html" class="back-link">← Voltar ao Admin</a>
          <h1 class="secao-titulo" style="text-align:left;margin-top:12px;">Novo Desafio</h1>
          <div class="secao-traco" style="margin:8px 0 0;"></div>
        </div>
        <div class="card">
          <form id="form-novo" style="display:flex;flex-direction:column;gap:22px;">
            <div>
              <label class="label" for="inp-title">Título do Desafio</label>
              <input id="inp-title" type="text" class="input" required placeholder="Ex: Desafio #1 — Paisagem ao pôr do sol" />
            </div>

            <div>
              <label class="label">Imagem Master</label>
              <p style="font-size:13px;color:var(--texto-sec);margin-bottom:12px;">Cole a URL da imagem que os jogadores vão tentar recriar.</p>
              <input id="inp-img" type="url" class="input" required placeholder="https://exemplo.com/imagem.jpg" />
              <button type="button" id="btn-preview" class="btn btn-secondary btn-sm" style="margin-top:8px;">
                <i class="bi bi-eye"></i> Visualizar
              </button>
              <div id="preview-wrap" style="display:none;margin-top:14px;border-radius:8px;overflow:hidden;border:2px solid var(--ambar);">
                <img id="img-preview" src="" alt="Preview" style="width:100%;object-fit:contain;max-height:260px;display:block;" />
              </div>
            </div>

            <div>
              <label class="label" for="inp-mprompt">Prompt Original <span style="color:var(--texto-sec);font-weight:400;">(secreto)</span></label>
              <textarea id="inp-mprompt" class="input" rows="4" required
                placeholder="Cole aqui o prompt exato que você usou para gerar a imagem master..."
                style="resize:none;"></textarea>
            </div>

            <p id="erro" style="color:#DC2626;font-size:14px;background:#FEE2E2;padding:10px 14px;border-radius:8px;display:none;"></p>
            <button type="submit" id="btn-criar" class="btn btn-primary" style="width:100%;">Criar Desafio</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-esq">
      <p>Prefeitura Municipal de Oriximiná</p>
      <p>A transformação não vai parar</p>
    </div>
    <div class="footer-dir">
      <p>SEMEG</p>
      <p>Secretaria Municipal de Eficiência Governamental</p>
    </div>
  </footer>

  <script src="../js/header.js"></script>
  <script>
    document.getElementById("btn-preview").addEventListener("click", () => {
      const url = document.getElementById("inp-img").value.trim();
      if (!url) return;
      document.getElementById("img-preview").src = url;
      document.getElementById("preview-wrap").style.display = "block";
    });

    document.getElementById("form-novo").addEventListener("submit", (e) => {
      e.preventDefault();
      const title        = document.getElementById("inp-title").value.trim();
      const masterImage  = document.getElementById("inp-img").value.trim();
      const masterPrompt = document.getElementById("inp-mprompt").value.trim();
      const erro         = document.getElementById("erro");

      if (!masterImage.startsWith("http")) {
        erro.textContent = "Cole uma URL de imagem válida (começa com http).";
        erro.style.display = "block"; return;
      }
      erro.style.display = "none";

      const desafio = { id: "desafio-" + Date.now(), title, masterImage, masterPrompt, isActive: true };
      localStorage.setItem("desafioConfig", JSON.stringify(desafio));
      localStorage.removeItem("submissions");
      location.href = "index.html";
    });
  </script>
</body>
</html>
