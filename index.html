<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Batalha de Prompt</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <style>
    .tela { flex:1; background:var(--azul-escuro); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px 24px; gap:16px; overflow:hidden; min-height:0; }
    .tela h1 { color:#fff; font-weight:700; font-size:clamp(16px,2vw,28px); text-align:center; flex-shrink:0; }
    .img-wrap { border-radius:16px; overflow:hidden; box-shadow:0 8px 40px rgba(0,0,0,0.4); flex:1 1 0; min-height:0; min-width:0; width:100%; cursor:zoom-in; }
    .img-wrap img { width:100%; height:100%; object-fit:contain; display:block; }
    #lightbox { display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.92); align-items:center; justify-content:center; cursor:zoom-out; }
    #lightbox.open { display:flex; }
    #lightbox img { max-width:95vw; max-height:95vh; object-fit:contain; border-radius:8px; }
    #lightbox-close { position:absolute; top:16px; right:20px; font-size:32px; color:#fff; cursor:pointer; opacity:0.7; }
    #lightbox-close:hover { opacity:1; }
  </style>
</head>
<body>
  <header class="header">
    <a href="index.html" class="header-brand">
      <img src="prefeitura_oriximina.png" alt="Prefeitura de Oriximiná" class="header-logo" />
      <span class="header-title">Batalha de Prompt</span>
    </a>
  </header>

  <main style="background:var(--azul-escuro);display:flex;flex-direction:column;">
    <div id="tela-aguardando" class="tela">
      <div style="text-align:center;color:#fff;">
        <i class="bi bi-hourglass" style="font-size:52px;color:var(--ambar);display:block;margin-bottom:16px;"></i>
        <h2 style="font-weight:700;font-size:22px;margin-bottom:8px;">Aguardando rodada...</h2>
        <p style="color:rgba(255,255,255,0.45);font-size:15px;">O admin ainda não ativou nenhum desafio.</p>
      </div>
    </div>
    <div id="tela-desafio" class="tela" style="display:none;">
      <h1 id="desafio-titulo"></h1>
      <div class="img-wrap"><img id="desafio-img" src="" alt="Imagem da rodada" /></div>
    </div>
  </main>

  <div id="lightbox" onclick="fecharLightbox()">
    <span id="lightbox-close" onclick="fecharLightbox()">✕</span>
    <img id="lightbox-img" src="" alt="" onclick="event.stopPropagation()" />
  </div>

  <footer>
    <div class="footer-esq">
      <p>Prefeitura Municipal de Oriximiná</p>
      <p>A transformação não vai parar</p>
    </div>
    <div class="footer-dir">
      <p>SEMEG</p>
      <p>Secretaria Municipal de Eficiência Governamental</p>
    </div>
  </footer>

  <script>
    function fecharLightbox() { document.getElementById("lightbox").classList.remove("open"); }
    document.addEventListener("keydown", e => { if (e.key === "Escape") fecharLightbox(); });
  </script>
  <script src="js/header.js"></script>
  <script type="module">
    import { db } from "./js/app.js";
    import { ref, onValue } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

    onValue(ref(db, "challenge"), snap => {
      const ch = snap.val();
      if (ch && ch.isActive && ch.masterImage) {
        document.getElementById("desafio-titulo").textContent    = ch.title;
        document.getElementById("desafio-img").src               = ch.masterImage;
        document.getElementById("tela-desafio").style.display    = "flex";
        document.getElementById("tela-aguardando").style.display = "none";
      } else {
        document.getElementById("tela-desafio").style.display    = "none";
        document.getElementById("tela-aguardando").style.display = "flex";
      }
    });

    document.querySelector(".img-wrap").addEventListener("click", () => {
      const src = document.getElementById("desafio-img").src;
      if (!src) return;
      document.getElementById("lightbox-img").src = src;
      document.getElementById("lightbox").classList.add("open");
    });
  </script>
</body>
</html>
